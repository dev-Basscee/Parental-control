name: Build & Release GuardianDesk Agent

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push a tag like  v1.2.3  → builds three Windows exes and creates a
#     GitHub Release with all three attached.
#   • Manual workflow_dispatch (useful for testing the pipeline without a tag).
#
# Three executables are produced every release:
#   GuardianDesk-Setup-vX.Y.Z.exe  — entry: setup.js    (interactive wizard)
#   guardiandesk-agent.exe          — entry: agent.js    (headless Windows Service)
#   guardiandesk-uninstall.exe      — entry: uninstall.js (cleanup tool)
#
# Parents download all three into the same folder on the child's PC.
# The setup exe pairs the device then registers agent.exe as a Windows Service
# via nssm. All three must live in the SAME directory.
#
# Required GitHub Actions Secrets (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL          — https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY     — anon/public key
#   SUPABASE_SERVICE_KEY  — service-role key (Realtime only)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build-and-release:
    name: Build installer on Windows
    runs-on: windows-latest   # MUST be Windows — pkg produces platform-specific binaries

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: guardiandesk-agent/package-lock.json

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: guardiandesk-agent
        run: npm ci

      # ── 4. Embed Supabase credentials into .env ────────────────────────────
      # The .env is bundled into both pkg snapshots via the "assets" field in
      # package.json so dotenv can read it at runtime inside either .exe.
      # Values come from GitHub Actions Secrets — set them at:
      #   Repository → Settings → Secrets and variables → Actions
      - name: Validate secrets are set
        shell: pwsh
        run: |
          $missing = @()
          if (-not "${{ secrets.SUPABASE_URL }}")         { $missing += "SUPABASE_URL" }
          if (-not "${{ secrets.SUPABASE_ANON_KEY }}")    { $missing += "SUPABASE_ANON_KEY" }
          if (-not "${{ secrets.SUPABASE_SERVICE_KEY }}") { $missing += "SUPABASE_SERVICE_KEY" }
          if ($missing.Count -gt 0) {
            Write-Error "❌ Missing GitHub Actions secrets: $($missing -join ', '). Go to Settings → Secrets and variables → Actions and add them before tagging."
            exit 1
          }
          Write-Host "✅ All three Supabase secrets are present."

      - name: Write embedded .env for pkg
        working-directory: guardiandesk-agent
        shell: pwsh
        run: |
          $envPath = Join-Path (Get-Location) ".env"
          $envContent = "SUPABASE_URL=${{ secrets.SUPABASE_URL }}`nSUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}`nSUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}"
          [System.IO.File]::WriteAllText($envPath, $envContent)
          $written = Get-Content $envPath -Raw
          # Print sizes so CI log shows the .env was written with real content
          Write-Host "Written .env ($((Get-Item $envPath).Length) bytes)"
          Write-Host "  SUPABASE_URL length:         $("${{ secrets.SUPABASE_URL }}".Length)"
          Write-Host "  SUPABASE_ANON_KEY length:    $("${{ secrets.SUPABASE_ANON_KEY }}".Length)"
          Write-Host "  SUPABASE_SERVICE_KEY length: $("${{ secrets.SUPABASE_SERVICE_KEY }}".Length)"

      # ── 5. Install @yao-pkg/pkg and pre-fetch the node22 binary ───────────
      # pkg@5 (Vercel) is abandoned — CDN no longer hosts node18+ binaries.
      # @yao-pkg/pkg is the maintained fork with full node22 support.
      # pkg-fetch downloads the pre-built node22-win-x64 binary so the build
      # steps don't have to compile Node from source (which takes 20+ minutes).
      - name: Install @yao-pkg/pkg
        run: npm install -g @yao-pkg/pkg

      - name: Pre-fetch pkg node22 binary
        run: npx --yes @yao-pkg/pkg-fetch --node-range node22 --platform win --arch x64

      # ── 6. Build the agent exe (headless Windows Service) ──────────────────
      # This exe is what the Windows Service Control Manager actually spawns.
      # It MUST be built first so setup.exe can reference it by name.
      - name: Build guardiandesk-agent.exe
        working-directory: guardiandesk-agent
        run: pkg agent.js --targets node22-win-x64 --compress GZip --output dist/guardiandesk-agent.exe

      # ── 7. Build the setup exe (interactive wizard) ────────────────────────
      # Entry point is setup.js. Inside the snapshot resolveAgentPath() returns
      # path.join(path.dirname(process.execPath), 'guardiandesk-agent.exe')
      # so both exes must be placed in the same directory on the child's PC.
      - name: Build GuardianDesk-Setup exe
        working-directory: guardiandesk-agent
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "dev" }
          $setupName = "GuardianDesk-Setup-${version}.exe"
          pkg setup.js --targets node22-win-x64 --compress GZip --output "dist/$setupName"
          Write-Host "Setup exe ready: dist/$setupName"
          "SETUP_NAME=$setupName" >> $env:GITHUB_ENV

      # ── 8. Build the uninstall exe ──────────────────────────────────────────
      # Ship uninstall.js as its own pkg exe so parents have a working uninstall.
      - name: Build guardiandesk-uninstall.exe
        working-directory: guardiandesk-agent
        run: pkg uninstall.js --targets node22-win-x64 --compress GZip --output dist/guardiandesk-uninstall.exe

      # ── 9. Verify all three exes exist ──────────────────────────────────────
      - name: Verify dist output
        working-directory: guardiandesk-agent
        shell: pwsh
        run: |
          $setup     = "dist\$env:SETUP_NAME"
          $agent     = "dist\guardiandesk-agent.exe"
          $uninstall = "dist\guardiandesk-uninstall.exe"
          if (-not (Test-Path $setup))     { Write-Error "MISSING: $setup"; exit 1 }
          if (-not (Test-Path $agent))     { Write-Error "MISSING: $agent"; exit 1 }
          if (-not (Test-Path $uninstall)) { Write-Error "MISSING: $uninstall"; exit 1 }
          Write-Host "OK: $setup ($((Get-Item $setup).Length) bytes)"
          Write-Host "OK: $agent ($((Get-Item $agent).Length) bytes)"
          Write-Host "OK: $uninstall ($((Get-Item $uninstall).Length) bytes)"

      # ── 10. Create GitHub Release and upload all three exes ────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GuardianDesk Agent ${{ github.ref_name }}"
          body: |
            ## GuardianDesk Agent ${{ github.ref_name }}

            ### Installation (child's PC)
            1. Download **all three** files below into the **same folder** (e.g. `C:\GuardianDesk\`):
               - `GuardianDesk-Setup-${{ github.ref_name }}.exe`
               - `guardiandesk-agent.exe`
               - `guardiandesk-uninstall.exe`
            2. Right-click `GuardianDesk-Setup-${{ github.ref_name }}.exe` → **Run as Administrator**.
            3. Open the GuardianDesk dashboard on the parent device, go to **Devices → Pair New Device** and copy the 6-digit code.
            4. Enter the code when the setup wizard prompts you.
            5. The agent installs as a Windows Service and starts automatically on every boot.

            > **Why three files?** The setup wizard registers `guardiandesk-agent.exe` (the
            > headless service) with Windows via nssm. All three must be in the same folder.

            ### Requirements
            - Windows 10 / 11 (64-bit)
            - Administrator rights during installation
            - Active GuardianDesk parent account

            ### Uninstalling
            Download `guardiandesk-uninstall.exe` (attached below) into the
            same folder as the other two files, then run it as Administrator:
            ```powershell
            & ".\guardiandesk-uninstall.exe"
            ```
            This stops and removes the Windows Service, deletes the
            `GuardianDesk_Block_*` firewall rules, and removes the stored
            credentials and log files.
          files: |
            guardiandesk-agent/dist/GuardianDesk-Setup-${{ github.ref_name }}.exe
            guardiandesk-agent/dist/guardiandesk-agent.exe
            guardiandesk-agent/dist/guardiandesk-uninstall.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
