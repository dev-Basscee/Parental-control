name: Build & Release GuardianDesk Agent

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push a tag like  v1.2.3  → builds a Windows installer and creates a
#     GitHub Release with the installer .exe attached.
#   • Manual workflow_dispatch (useful for testing the pipeline without a tag).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build-and-release:
    name: Build installer on Windows
    runs-on: windows-latest        # MUST be Windows — pkg produces platform-specific binaries

    defaults:
      run:
        working-directory: guardiandesk-agent

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: guardiandesk-agent/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Embed Supabase config into the build ───────────────────────────────
      # We write a .env file that gets bundled into the pkg snapshot filesystem.
      # The values come from GitHub Actions Secrets — set them in:
      #   Repository → Settings → Secrets and variables → Actions
      #
      #   SUPABASE_URL          your project URL
      #   SUPABASE_ANON_KEY     anon/public key
      #   SUPABASE_SERVICE_KEY  service-role key (Realtime only — never exposed to browser)
      - name: Write embedded .env for pkg
        shell: pwsh
        run: |
          @"
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          "@ | Set-Content .env

      # ── 5. Install pkg globally ───────────────────────────────────────────────
      - name: Install pkg
        run: npm install -g pkg@5

      # ── 6. Build the standalone agent.exe ────────────────────────────────────
      # pkg bundles agent.js + all node_modules + the .env into one executable.
      # --targets node20-win-x64 → Windows 64-bit, Node 20 runtime embedded
      # --output sets the output path
      #
      # The .env file is included via the "assets" field in package.json (added below)
      # so dotenv can read it from the pkg snapshot at runtime.
      - name: Add pkg assets to package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg | Add-Member -Force -NotePropertyName "pkg" -NotePropertyValue @{
            assets = @(".env", "lib/**/*")
            targets = @("node20-win-x64")
          }
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Build agent.exe with pkg
        run: pkg agent.js --targets node20-win-x64 --output dist/guardiandesk-agent.exe

      # ── 7. Build the self-extracting setup.exe using the PowerShell installer ─
      # We combine guardiandesk-agent.exe + setup.ps1 into a single self-extracting
      # archive using 7-Zip (pre-installed on windows-latest GitHub runners).
      #
      # Parents download ONE file: GuardianDesk-Setup-<version>.exe
      # When they run it (as Admin) it self-extracts and runs setup.ps1.
      - name: Copy setup script into dist
        shell: pwsh
        run: Copy-Item ..\setup.ps1 dist\setup.ps1

      - name: Build self-extracting installer with 7-Zip SFX
        shell: pwsh
        run: |
          # 7z.exe is at C:\Program Files\7-Zip\7z.exe on windows-latest
          $7z = "C:\Program Files\7-Zip\7z.exe"

          # Create a 7-Zip config that runs setup.ps1 on extraction
          $sfxConfig = @"
          ;!@Install@!UTF-8!
          Title="GuardianDesk Agent Setup"
          RunProgram="powershell.exe -ExecutionPolicy Bypass -File setup.ps1"
          ;!@InstallEnd@!
          "@
          $sfxConfig | Set-Content -Encoding UTF8 sfx_config.txt

          # The SFX module ships with 7-Zip
          $sfxModule = "C:\Program Files\7-Zip\7z.sfx"

          # Pack dist/ contents into a .7z archive
          & $7z a -t7z dist\payload.7z dist\guardiandesk-agent.exe dist\setup.ps1

          # Concatenate: sfx module + config + archive = self-extracting .exe
          $version = "${{ github.ref_name }}"
          $outName = "GuardianDesk-Setup-${version}.exe"
          $bytes  = [System.IO.File]::ReadAllBytes($sfxModule)
          $bytes += [System.Text.Encoding]::UTF8.GetBytes((Get-Content sfx_config.txt -Raw))
          $bytes += [System.IO.File]::ReadAllBytes("dist\payload.7z")
          [System.IO.File]::WriteAllBytes("dist\$outName", $bytes)

          Write-Host "Built: dist\$outName"

      # ── 8. Create GitHub Release and upload installer ─────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GuardianDesk Agent ${{ github.ref_name }}"
          body: |
            ## GuardianDesk Agent ${{ github.ref_name }}

            ### Installation
            1. Download `GuardianDesk-Setup-${{ github.ref_name }}.exe` below.
            2. Right-click → **Run as Administrator**.
            3. Enter the 6-digit pairing code from the GuardianDesk dashboard when prompted.
            4. The agent installs as a Windows Service and starts automatically.

            ### Requirements
            - Windows 10 / 11 (64-bit)
            - Administrator rights during installation
            - Active GuardianDesk account (get one at your dashboard URL)

            ### Uninstalling
            Open an **Administrator PowerShell** and run:
            ```
            & "C:\Program Files\GuardianDesk\uninstall.bat"
            ```
          files: |
            guardiandesk-agent/dist/GuardianDesk-Setup-${{ github.ref_name }}.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
